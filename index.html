      "questions": [
        {"q":"PASSAGE: On August 3, 1492, Christopher Columbus set sail from Palos, Spain, with less than a hundred crew members to discover a new route to Asia. After spending a difficult time at sea, the party sighted land early on the morning of October 12, 1492. They set foot on an island in the Bahamas which they named Al Salvador. Columbus presumed that the indigenous people were Native Indians as he was under the mistaken belief that he had set foot on Indian soil. Probably some 10 million American Indians were natives to the land before the large-scale inhabitation by Europeans and subsequent annihilation of Native Americans started. However, it took more than a hundred years after Columbus discovered America for the Europeans to finally take the momentous decision to make the New World their home. The Native Americans actually welcomed the pale-skinned visitors primarily out of curiosity. They were fascinated by the steel knives and swords, fire spewing cannons, brass and copper utensils. Eventually, cultural differences erupted. The natives could not stomach the arrogance of the newcomers and the scant respect they paid to nature. The European settlers viewed every resource, plants, animals and people, as something to be commercially exploited. The native Indians were vastly outnumbered in the wars that ensued. The resistance they put up never proved enough. The nomadic lifestyle of the Indians, the relatively unsophisticated weapons at their disposal, the unwillingness of some of their own people to defend themselves, and the diseases of the white men all contributed to the virtual elimination of their race. Some of the diseases brought by Europeans that decimated the natives were small pox, plague, measles, cholera, typhoid and malaria. America was named after an Italian navigator, Amerigo Vespucci. QUESTION: The primary purpose of the passage is to:","options":["Disprove the notion that America was named after Columbus","Provide a snapshot of the discovery of America and the early years of settlements","Explain how the Europeans eliminated the Native Americans in their own land","Discuss how the process of colonization of America started"],"answer":1,"explanation":"The passage covers discovery, early settlements and native relations, so a snapshot is the best summary."},
        {"q":"From the passage we can infer that in comparison to the Europeans, Native Americans were:","options":["Careless about their environment","A very unhealthy lot","More respectful of nature","Ignorant about sanitation"],"answer":2,"explanation":"The passage says Europeans had scant respect for nature, so the natives respected nature more."},
        {"q":"What can be inferred from the third paragraph?","options":["The native Americans did not have any weapons with which to defend themselves.","The native Americans probably attached a lot of importance to and respected nature.","The native Americans did not know how to use natural resources.","The early settlers became arrogant as they could commercially exploit resources."],"answer":1,"explanation":"Europeans were criticized for scant respect to nature, so natives valued nature."},
        {"q":"Based on the passage, which of the following CANNOT be inferred? I. Alien diseases wiped out a large proportion of certain Native American tribes II. The early settlers totally eliminated the Native Americans III. To the early settlers, even people were resources to be exploited commercially","options":["Only I","Only III","I & III","Only II"],"answer":3,"explanation":"II is too extreme. The passage says virtual elimination, not total elimination."},
        {"q":"PASSAGE: It is believed that Shakespeare wrote The Merchant of Venice between 1596 and 1598. The classification of this play as a comedy could stupefy many modern day youngsters who are used to a somewhat different meaning. But during Shakespeare's times, a comedy was as poignant and melodramatic as a tragedy with separation, struggle and heightened tensions being the central theme. However, the ending was always a happy one. Many people feel more comfortable with the term problem plays or tragicomedies than comedies. This play tends to stir up a hornet's nest whenever it is discussed or staged. As The Merchant of Venice can be viewed from different perspectives, it evokes several reactions including extreme sympathy for the villain, the Jewish moneylender Shylock, and anger against the hero, his friend Bassanio, and Bassanio's wife, Portia. Shakespeare has been accused of anti-Semitism because of the contemptuous utterances of his hero who even calls the villain a cur. Critics of this play overlook the possibility that Shakespeare was just commenting upon the social situation prevailing during his time. A dispassionate analysis will reveal the superb portrayal of the deep anguish experienced by the marginalized sections of society. Sample these lines of Shylock: Hath not a Jew eyes? Hath not a Jew hands, organs, dimensions, senses, affections, passions...If you prick us, do we not bleed? These powerful words put by Shakespeare into the mouth of a man portrayed as a villain would not be so potent if this master dramatist had no deep-felt empathy for a character, who probably was more wronged than he wronged others. QUESTION: From the passage, we can infer that the author is:","options":["Of the opinion that Shakespeare had no deep-felt empathy for any of his characters","Uncomfortable with the notion of heroes possessing negative traits","Uncomfortable with the term comedy being used for plays like The Merchant of Venice","Supporting the critics who feel that the hero is not a likeable character"],"answer":2,"explanation":"The passage says these sentences explain the discomfort of we modernists when such dramas are called comedies."},
        {"q":"The tone of the passage about The Merchant of Venice is best described as:","options":["Dismissive","Critical but balanced","Purely sarcastic","Indifferent"],"answer":1,"explanation":"The author criticizes shallow readings of the play and defends a deeper understanding, showing a balanced critical approach."},
        {"q":"In the passage, the word cur is used to mean:","options":["A careful reader","An aggressive mongrel dog used as an insult","A type of stage direction","A loyal companion"],"answer":1,"explanation":"The passage itself explains that cur is a derogatory word meaning an aggressive mongrel dog."},
        {"q":"PASSAGE: The need for knowledge of the constitution and functions of human nature is great because the teacher's attitude to subject matter is different from the pupil's. The teacher presents in actuality what the pupil represents only in posse. That is, the teacher already knows the things which the student is only learning. When engaged in the direct act of teaching, the instructor needs to have subject matter at his fingers' ends; his attention should be upon the attitude and response of the pupil. To understand the latter in its interplay with subject matter is his task, while the pupil's mind, naturally, should be not on itself but on the topic in hand. Or to state the same point in a somewhat different manner: the teacher should be occupied not with subject matter in itself but in its interaction with the pupils' present needs and capacities. Hence simple scholarship is not enough. QUESTION: It can be inferred that:","options":["Simple scholarship is lop-sided in its focus","Simple scholarship might overlook the subject matter","Simple scholarship, with a narrow focus, might not place enough emphasis on the student's needs","Simple scholarship will always be lopsided in nature"],"answer":2,"explanation":"The passage says the teacher should focus on students' needs, so narrow scholarship misses student needs."},
        {"q":"PASSAGE: A being whose activities are associated with others has a social environment. What he does and what he can do depend upon the expectations, demands, approvals and condemnations of others. A being connected with other beings cannot perform his own activities without taking the activities of others into account. We might as well try to imagine a business man doing business all by himself, as to conceive it possible to define the activities of an individual in terms of his isolated actions. Thinking and feeling that have to do with action in association with others is as much a social mode of behavior as is the most overt cooperative or hostile act. QUESTION: It can be inferred that:","options":["In our social world, one's thinking, feelings and actions cannot stand in isolation to actions of others","In our social world, thinking, feelings and actions of an individual are driven by motivations of others","In our social world, thinking, feelings and actions of a person cannot stand in isolation to those of others","In our social world, thinking, feelings and actions of a single person are juxtaposed retrospectively to those of others"],"answer":2,"explanation":"The passage says we cannot act in isolation and that thinking and feeling are also social modes."},
        {"q":"PASSAGE: An increase in the level of serotonin in the human body is known to significantly enhance the mood of the person and in some cases, help people overcome depression. Serotonin taken orally does not pass into the pathways of the central nervous system because it does not cross the blood-brain barrier. However, tryptophan and its metabolite 5-hydroxytryptophan, from which serotonin is synthesized, do cross the blood-brain barrier. These agents are available as dietary supplements and may be effective serotonergic agents. QUESTION: Which of the following can be correctly inferred?","options":["Individuals who do not consume enough tryptophan can develop depressive tendencies","Individuals who consume tryptophan can metabolize enough serotonin and do not run the risk of depression","Consumption of serotonin-laced foods can help cure depression in some cases","Tryptophan is an effective agent that can help cure depression in some cases"],"answer":3,"explanation":"The passage says tryptophan crosses the blood-brain barrier and may be effective, so D is the safest inference."},
        {"q":"PASSAGE: Political education may be defined as the preparation of a citizen to take well informed, responsible and sustained action for participation in the national struggle in order to achieve the socio-economic objectives of the country. The predominant socio-economic objectives in India are the abolition of poverty and the creation of a modern democratic, secular and socialist society in place of the present traditional, feudal, hierarchical and inegalitarian one. Under colonial rule, Congress leaders argued that political education was important. But when they came to power in 1947 they almost adopted the British policy. The wise academicians wanted political support without political interference. What we have actually received is infinite political interference with little genuine political support. QUESTION: What should be the main purpose of political education?","options":["To bring qualitative change in the entire education system","To create an egalitarian society","To prepare the young generation with high intellectual acumen","To champion the cause of elitism"],"answer":1,"explanation":"The passage says the objective is to replace the present inegalitarian society, so the goal is an egalitarian society."},
        {"q":"PASSAGE continued: How has politics been related to educational institutions after independence?","options":["They got almost no political support as well as political interference","They got political support at the cost of political interference","There was substantial interference without political support","Politics and education remained completely separate"],"answer":2,"explanation":"The passage says there was infinite political interference with little genuine political support."},
        {"q":"PASSAGE continued: Which is the major drawback of the present education system?","options":["The education system mainly represents the oppressed sections of the society","The present education system promotes the domination of the privileged few","It is based on the British model of education","It does not teach patriotism"],"answer":1,"explanation":"The passage says the education system has become even more elite-oriented."},
        {"q":"PASSAGE continued: Which word is most opposite in meaning to hamper as used in the passage?","options":["Accelerate","Envision","Foster","Initiate"],"answer":0,"explanation":"Hamper means to slow down or hinder. The opposite is accelerate."},
        {"q":"PASSAGE: Microfinance is powerful, but it is clearly no panacea. It does not directly address some structural problems facing Indian society and the economy, and it is not yet as efficient as it will be when economies of scale are realized and a more supportive policy environment is created. Loan products are still too inflexible, and savings and insurance services that the poor also need are not widely available due to regulatory barriers. Still, microfinance is one of the few market-based, scalable anti-poverty solutions that is in place in India today. According to Sa-Dhan, the overall outreach is 6.5 million families and the sector-wide loan portfolio is Rs 2,500 crore. However, this is meeting only 10% of the estimated demand. The local and national governments have an important role to play. First and foremost, the market should be left to set interest rates, not the state. Ensuring transparency and full disclosure of rates including fees is something the government should ensure. QUESTION: Which of the following is NOT a challenge faced by microfinance in India?","options":["It does not help the poorest","It becomes efficient only when economies of scale are achieved","There is a non-conducive policy environment","There are structural problems in Indian society"],"answer":1,"explanation":"Economies of scale is a condition for efficiency, not a challenge. The other three are stated as challenges."},
        {"q":"PASSAGE continued: Which of the following is correct about microfinance?","options":["The supply is more than demand","The demand is more than supply","The supply and demand are well balanced","None of these can be inferred"],"answer":1,"explanation":"The passage says microfinance is meeting only 10% of the estimated demand, so demand is more than supply."},
        {"q":"PASSAGE continued: What is the author's view about interest rates?","options":["The government should set them","There should be transparency with regard to them","The market forces should set them","Both A and B","Both B and C"],"answer":4,"explanation":"The author says the market should set rates and the government should ensure transparency, so both B and C."},
        {"q":"PASSAGE: Since the late 1970s when the technology for sex determination first came into being, sex-selective abortion has unleashed a saga of horror. Experts are calling it sanitized barbarism. Although foetal sex determination and sex selection is a criminal offence in India, the practice is rampant. Dr. Puneet Bedi says these days he hardly sees a family with two daughters. Child rights activist Dr. Sabu George says foeticide is the most extreme form of violence against women. Nature intended the womb to be a safe space. Today, doctors have made it the most unsafe space for the female child. Dr. Satish Agnihotri calls the technology a weapon of mass destruction. Dr. Bedi refers to it as genocide. Varsha Deshpande says the PCPNDT Act is very well conceived and easy to use. Akhila Sivadas agrees the law is well conceived and the need of the hour is legal literacy to ensure the law is implemented. On the demand side, experts argue that women's participation in the workforce will make a difference to how women are seen. Others feel there needs to be widespread visible contempt and anger in society against this genocide. QUESTION: Which of the following will Dr. George agree to?","options":["The girl child is as safe in the mother's womb as after birth","The girl child is safe in the mother's womb in comparison to after birth","The girl child is safer after birth as compared to the mother's womb","None of these"],"answer":3,"explanation":"Dr. George says the womb is the most unsafe space for the female child, so none of the first three fit."},
        {"q":"PASSAGE continued: What is the solution to the problem of female foeticide as envisioned by Dr. Bedi?","options":["Effective use of law","Mass public outrage","Comparison with Nithari killing","Contempt towards doctors"],"answer":1,"explanation":"Dr. Bedi says there needs to be widespread visible contempt and anger in society, like the kind seen against the Nithari killings."},
        {"q":"PASSAGE continued: What does the word sanitised imply in the first paragraph?","options":["Unforgivable","Legitimate","Free from dirt","None of these"],"answer":3,"explanation":"Sanitised here means made to seem clean or acceptable, not literally free from dirt."},
        {"q":"PASSAGE continued: What is Akhila Sivadas's opinion on the PCPNDT Act?","options":["The Act is inconsistent","The Act needs reform","The Act encourages demand for foeticide","The Act is sound, but needs enforcement"],"answer":3,"explanation":"She says the law is very well conceived and the need is legal literacy to ensure implementation."},
        {"q":"PASSAGE: The economic transformation of India is one of the great business stories of our time. As stifling government regulations have been lifted, entrepreneurship has flourished. India's seemingly endless flow of young, motivated engineers, scientists and managers offering developed-world skills at developing-world wages is held to be putting American jobs at risk. But India has run into a surprising hitch on its way to superpower status: its inexhaustible supply of workers is becoming exhausted. Although India has one of the youngest workforces on the planet, the head of Infosys said recently that there was an acute shortage of skilled manpower. A study by Hewitt Associates projects that this year salaries for skilled workers will rise fourteen and a half per cent. How is this possible in a country that every year produces two and a half million college graduates and four hundred thousand engineers? Start with the fact that just ten per cent of Indians get any kind of post-secondary education. Of that ten per cent, the vast majority go to one of India's seventeen thousand colleges, many of which are closer to community colleges than to four-year institutions. India does have more than three hundred universities, but a recent survey put only two of them among the top hundred in the world. QUESTION: What can you infer as the meaning of stifling from the passage?","options":["Democratic","Liberal","Impeding","Undemocratic"],"answer":2,"explanation":"Stifling means restricting or impeding growth."},
        {"q":"PASSAGE continued: What is an appropriate title to the passage?","options":["Growing Indian Economy","Higher Education in India","India's Skill Shortage","Entrepreneurship in India"],"answer":2,"explanation":"The passage's central theme is India's shortage of skilled labour."},
        {"q":"PASSAGE continued: Why are salaries for skilled workers rising?","options":["Companies are paying higher to lure skilled people","American companies are ready to pay higher to skilled workers","Entrepreneurship is growing in India","There is not enough skilled workers while the demand for them is high"],"answer":3,"explanation":"The passage says demand for skilled labour is outstripping supply."},
        {"q":"PASSAGE continued: What is the paradox of the Indian economy today?","options":["The economic progress is impressive, but the poor are not benefited","The economic progress is impressive, disallowing the government to take tough decisions","There is not enough skilled workforce and the government does not realize this","Government is not ready to invest in setting up new universities"],"answer":1,"explanation":"The passage says the more certain the glowing future seems, the less likely that future becomes because the government defers difficult choices."}

const STORAGE_KEY = "verbalCram.progress.v1";

let DATA = null;
let progress = loadProgress(); // { "sectionId:index": true/false }
let currentSection = null;

function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch { return {}; }
}
function saveProgress() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
}
function key(sid, i) { return sid + ":" + i; }

async function init() {
  try {
    const res = await fetch("data.json");
    if (!res.ok) throw new Error("no data.json");
    DATA = await res.json();
  } catch (e) {
    DATA = FALLBACK;
  }
  buildNav();
  showSection(DATA.sections[0].id);
  updateProgressBar();
}

function buildNav() {
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  DATA.sections.forEach(s => {
    const b = document.createElement("button");
    b.textContent = (s.icon || "") + " " + s.title;
    b.dataset.id = s.id;
    b.onclick = () => showSection(s.id);
    nav.appendChild(b);
  });
}

function showSection(id) {
  currentSection = id;
  document.querySelectorAll("#nav button").forEach(b => {
    b.classList.toggle("active", b.dataset.id === id);
  });
  const s = DATA.sections.find(x => x.id === id);
  const main = document.getElementById("main");
  main.innerHTML = "";

  const h = document.createElement("h2");
  h.className = "section-title";
  h.textContent = (s.icon || "") + " " + s.title;
  main.appendChild(h);

  const p = document.createElement("p");
  p.className = "section-desc";
  p.textContent = s.description || "";
  main.appendChild(p);

  if (s.rules && s.rules.length) {
    const c = document.createElement("div");
    c.className = "card";
    c.innerHTML = "<h3>Rules</h3><ul>" + s.rules.map(r => "<li>" + esc(r) + "</li>").join("") + "</ul>";
    main.appendChild(c);
  }
  if (s.cheatCodes && s.cheatCodes.length) {
    const c = document.createElement("div");
    c.className = "card";
    c.innerHTML = "<h3>Cheat Codes</h3><ul>" + s.cheatCodes.map(r => "<li>" + esc(r) + "</li>").join("") + "</ul>";
    main.appendChild(c);
  }

  const qHeader = document.createElement("h3");
  qHeader.style.marginTop = "22px";
  qHeader.textContent = "Practice (" + s.questions.length + " questions)";
  main.appendChild(qHeader);

  s.questions.forEach((q, i) => main.appendChild(renderQuestion(s, q, i)));
}

function renderQuestion(section, q, idx) {
  const k = key(section.id, idx);
  const state = progress[k]; // true=correct, false=wrong, undefined=unanswered
  const wrap = document.createElement("div");
  wrap.className = "q";

  const qt = document.createElement("div");
  qt.className = "q-text";
  qt.innerHTML = esc(q.q) + ` <span class="badge ${state===true?'done':state===false?'wrong-done':''}">${state===true?'✓ done':state===false?'✗ wrong':'?'}</span>`;
  wrap.appendChild(qt);

  const expl = document.createElement("div");
  expl.className = "explanation";
  expl.textContent = "Why: " + q.explanation;

  q.options.forEach((opt, oi) => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = String.fromCharCode(65 + oi) + ". " + opt;
    btn.onclick = () => {
      // Mark all options disabled
      wrap.querySelectorAll(".option").forEach(b => b.disabled = true);
      if (oi === q.answer) {
        btn.classList.add("correct");
        progress[k] = true;
      } else {
        btn.classList.add("wrong");
        // highlight correct one
        const correctBtn = wrap.querySelectorAll(".option")[q.answer];
        correctBtn.classList.add("correct");
        // only record wrong if not already correct
        if (progress[k] !== true) progress[k] = false;
      }
      saveProgress();
      updateProgressBar();
      // update badge
      const badge = qt.querySelector(".badge");
      badge.className = "badge " + (progress[k] === true ? "done" : "wrong-done");
      badge.textContent = progress[k] === true ? "✓ done" : "✗ wrong";
      expl.classList.add("show");
    };
    wrap.appendChild(btn);
  });

  // If already answered before, prefill
  if (state !== undefined) {
    const opts = wrap.querySelectorAll(".option");
    opts.forEach(b => b.disabled = true);
    opts[q.answer].classList.add("correct");
    if (state === false) {
      // We don't know which wrong one was picked; just show the correct one.
    }
    expl.classList.add("show");
  }

  wrap.appendChild(expl);
  return wrap;
}

function updateProgressBar() {
  let total = 0, correct = 0;
  DATA.sections.forEach(s => {
    s.questions.forEach((_, i) => {
      total++;
      if (progress[key(s.id, i)] === true) correct++;
    });
  });
  const pct = total ? Math.round((correct / total) * 100) : 0;
  document.getElementById("bar").style.width = pct + "%";
  document.getElementById("progressText").textContent = correct + " / " + total + " correct (" + pct + "%)";
}

function esc(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

document.getElementById("resetBtn").onclick = () => {
  if (confirm("Reset all progress?")) {
    progress = {};
    saveProgress();
    showSection(currentSection);
    updateProgressBar();
  }
};

init();
</script>
