  * { box-sizing: border-box; }
  body {

    border-bottom: 1px solid #2a2f4a;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;

  header h1 { font-size: 18px; margin: 0; }

    flex: 1;
    min-width: 140px;
    max-width: 320px;
  }
  .progress-bar {
    height: 8px;
    background: #2a2f4a;
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-bar > div {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width 0.3s ease;
  }
  .progress-text { font-size: 12px; color: var(--muted); margin-top: 4px; }
  button {
    background: var(--accent);
    color: white;
    border: 0;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
  }
  button.ghost {
    background: transparent;
    border: 1px solid #3b4166;
    color: var(--muted);
  }
  button:hover { opacity: 0.9; }
  nav {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 12px 20px;
    border-bottom: 1px solid #2a2f4a;
  }
  nav button {
    background: var(--panel);
    color: var(--text);
    white-space: nowrap;
    padding: 6px 12px;
    font-size: 13px;
    border: 1px solid #2a2f4a;
  }
  nav button.active {
    background: var(--accent);
    border-color: var(--accent);
  }
  main {
    max-width: 820px;
    margin: 0 auto;
    padding: 20px;
  }
  .section-title {
    font-size: 26px;
    margin: 10px 0 4px;
  }
  .section-desc {
    color: var(--muted);
    margin-bottom: 18px;
  }
  .card {
    background: var(--panel);
    border: 1px solid #2a2f4a;
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .card h3 {
    margin: 0 0 8px;
    font-size: 15px;
    color: var(--accent-2);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .card ul { margin: 0; padding-left: 20px; }
  .card li { margin: 4px 0; }
  .q {
    background: var(--panel);
    border: 1px solid #2a2f4a;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .q .q-text { font-weight: 600; margin-bottom: 10px; }
  .option {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--panel-2);
    border: 1px solid #2a2f4a;
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    margin: 6px 0;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.15s ease;
  }
  .option:hover { border-color: var(--accent); }
  .option.correct {
    background: #14361f;
    border-color: var(--accent-2);
  }
  .option.wrong {
    background: #3a1a1a;
    border-color: var(--danger);
  }
  .option[disabled] { cursor: default; }
  .explanation {
    margin-top: 10px;
    padding: 10px 12px;
    background: #101528;
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    font-size: 13px;
    color: #cfd3ee;
    display: none;
  }
  .explanation.show { display: block; }
  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: #2a2f4a;
    color: var(--muted);
    margin-left: 6px;
  }
  .badge.done { background: #14361f; color: var(--accent-2); }
  .badge.wrong-done { background: #3a1a1a; color: var(--danger); }
  footer {
    text-align: center;
    padding: 30px 20px;
    color: var(--muted);
    font-size: 12px;
  }
  @media (max-width: 600px) {
    .section-title { font-size: 20px; }
    header h1 { font-size: 15px; }
  }
</style>
</head>

      "rules": [
        "Find the opening sentence. It is usually a general statement that introduces the topic and does not start with a pronoun. For example, \"Sriracha hot sauce originated in eastern Thailand\" is a good opener. But \"It may be derided as a modish condiment\" is not, because it needs a noun before it.",
        "Find the closing sentence. It usually gives a conclusion or a result, or starts with thus, therefore or finally. For example, \"So, I decided to spend a day having it with everything\" is a natural ending.",
        "Use pronouns to link sentences. A pronoun in one sentence refers to a noun in the previous sentence. For example, \"Thom Feeney has set up a page. His reasoning is...\" Here his links to Thom Feeney.",
        "Use articles to link. A or an introduces something for the first time, and the refers to it again. For example, \"A man walked in. The man was tall.\"",
        "Use connectors to link. Words like however, therefore, but, and, so and moreover join ideas. For example, \"It hasn't happened. However, audiences dipped in 1984.\"",
        "Look for chronology. If sentences mention first, then, after that or finally, arrange them in that order. For example, \"One was X. The second was Y. The last was Z.\"",
        "General information comes first and specific information comes later. Cause comes before effect. Theory comes before example."
      ],
      "cheatCodes": [
        "Look for a pair that must go together, then eliminate options that break that pair. For example, if you see \"He is a doctor. He works in Delhi\", that pair is fixed.",

        "The first sentence is usually a general statement and the last is usually a conclusion. Do not start with \"This is because...\" or \"Therefore...\".",

        "Eliminate options based on the first sentence alone. Very often only one option starts with a good opener."

      "rules": [
        "Check tense consistency. If the sentence uses past tense in one part, the other part usually uses past too. For example, \"He said that he was busy.\"",
        "Check subject-verb agreement. For example, in \"Each of the boys was present\", the word each is singular, so was is correct.",
        "Check pronoun agreement. For example, in \"Everyone must do their duty\", the word everyone is singular, so formal writing prefers his duty or his or her duty.",
        "Check prepositions. For example, we say appear before the committee and not appear to the committee. We say capable of and not capable in.",
        "Check articles. For example, \"a university\" is correct because university begins with a yu sound. \"An hour\" is correct because hour begins with a vowel sound.",
        "Check parallelism. For example, \"She likes singing, dancing and painting\" is correct because all three are gerunds. Do not mix gerunds and infinitives.",
        "Use comparatives correctly. Use than for comparisons and as...as for equality. For example, \"He is taller than me\" and not taller then me.",
        "In third conditionals use if plus had plus past participle. For example, \"If he had revised, he would have passed.\" Do not say \"If he would have revised.\"",
        "Do not use reason is because. The correct form is reason is that. For example, \"The reason he left was that he was unhappy.\""
      ],
      "cheatCodes": [

        "The longest option is often the most complete, but not always. Read all four carefully.",

        "For reason sentences, always pick reason is that. For conditionals, always pick had revised over would have revised."

      "questions": [

        {"q":"After the heavy rains last week, the water in the reservoir ______ another two feet.","options":["raised","risen","have risen by","rose"],"answer":3,"explanation":"Rise is intransitive, so its past tense is rose."},

        {"q":"If you had attended the seminar, you ______ a great deal.","options":["could benefit","would have benefited","would benefit","might benefit"],"answer":1,"explanation":"The third conditional uses would have plus past participle."},

        {"q":"The shoulder height of the Siberian mammoth was about nine ______.","options":["foot","foots","feet","feets"],"answer":2,"explanation":"The plural of foot after a number is feet."},
        {"q":"Police departments all over the world ______ computers to capture criminals.","options":["employs","employ","employing","is employing"],"answer":1,"explanation":"Departments is plural, so employ is correct."},
        {"q":"The novels of John Irving depict everyday life in New Hampshire where he ______.","options":["grown up","growed up","grew up","grow up"],"answer":2,"explanation":"The past tense of grow is grew."},
        {"q":"The Chinese, who are credited with ______ of gunpowder, also created the kite.","options":["the inventing","inventing","the invention","invention"],"answer":2,"explanation":"The correct phrase is the invention of gunpowder."},
        {"q":"In 1978, the atoll Enewetak was declared uninhabitable because of the high levels of radiation ______ U.S. nuclear testing.","options":["resulting","resulting from","resulted","resulted from"],"answer":1,"explanation":"Resulting from means caused by."},
        {"q":"George's personal diary and album formed ______ the places he had visited.","options":["the basis for his book about","the basis for his book regarding","the basis of his book about","the basis of his book on"],"answer":0,"explanation":"The standard collocation is basis for plus about the places."},
        {"q":"By next month Ms. Jones ______ Mayor of Tallahassee for two years.","options":["will be","will have been","will being","could have been"],"answer":1,"explanation":"The future perfect will have been is correct."},
        {"q":"The train will leave at 8.30 p.m. We ______ ready by 7.30 p.m. so that we can reach the station in time.","options":["were","must be","are","should have"],"answer":1,"explanation":"For a future need, must be ready is correct."},
        {"q":"They examined both the samples very carefully but failed to detect ______.","options":["some difference in","some difference between","any difference between","any difference among"],"answer":2,"explanation":"Two samples take between. A negative sentence takes any."},
        {"q":"India is a country with at least fifty major regional languages, ______.","options":["of whom fourteen have official recognition","fourteen that have official recognition","fourteen of which are officially recognised","among whom fourteen have official recognition"],"answer":2,"explanation":"Languages are things, so we use which and not whom."},
        {"q":"Which sentence is CORRECT?","options":["Each of us was scheduled to take the test.","Each of us were scheduled to take the test.","Every one of us were scheduled to take the test.","Each of us are scheduled to take the test."],"answer":0,"explanation":"Each is singular, so was is correct. The other options use the wrong verb."},
        {"q":"Which sentence is CORRECT?","options":["Mukesh is the richest of the two brothers.","You do not look well today.","She spoke quicker than he did.","I have never been more surer of anything in my life."],"answer":1,"explanation":"B is correct. A needs richer of two. C needs more quickly. D needs more sure."},
        {"q":"Which sentence is CORRECT?","options":["She looked suspicious at the man.","She looked suspiciously at the man wearing the trench coat.","The man looked suspiciously at her.","The man looked suspicious to her."],"answer":1,"explanation":"The adverb suspiciously modifies looked. So B is correct."},
        {"q":"Which sentence is CORRECT?","options":["You may look out the window.","Divide the candy between the two of you.","That is something with which I cannot agree.","Take your shoes off of the bed."],"answer":1,"explanation":"Between is used for two people, so B is correct."}

      "rules": [

        "Time expressions like in the morning, every day and last night usually go at the end or the beginning. For example, \"I take a shower in the morning.\"",
        "Adverbs of frequency like always, usually and never go before the main verb. For example, \"I always take a shower\" and not \"I take always a shower.\"",
        "In questions, the auxiliary comes before the subject. For example, \"Do you think getting a pet is a good idea?\" and not \"You do think...\"."

        {"q":"i wish that / canceled / school could be","options":["I wish that school could be canceled.","I wish school that could be canceled.","That I wish school could be canceled.","Could be canceled that I wish school."],"answer":0,"explanation":"The structure is I wish plus that plus clause."},

        {"q":"his best / over every day / friend comes","options":["His best friend comes over every day.","Every day his best friend comes over.","Friend his best comes over every day.","Over every day his best friend comes."],"answer":0,"explanation":"Subject plus verb plus adverb of place plus time."},
        {"q":"in about an / dinner will be ready / for us all to enjoy / together / hour or so","options":["Dinner will be ready in about an hour or so for us all to enjoy together.","In about an hour or so dinner will be ready for us to enjoy.","Dinner will be ready for us all to enjoy in about an hour or so together.","Ready dinner will be in about an hour for us all to enjoy together."],"answer":0,"explanation":"Subject plus verb plus time phrase plus purpose."},
        {"q":"when he finally / very dark outside already / got home from work it was","options":["When he finally got home from work, it was already very dark outside.","It was already very dark outside when he finally got home from work.","When finally he got home it was very dark outside already.","Very dark outside it was already when he finally got home from work."],"answer":0,"explanation":"When-clause comes first, then the main clause."},

    {
      "id": "reading-comprehension",
      "title": "Reading Comprehension",
      "icon": "📖",
      "description": "A passage followed by questions. Read once for the main idea, then scan for details. Beware of scope traps, extreme words such as all, never and always, and clever mismatches.",
      "rules": [
        "Do not read the passage first for detail questions. Scan the questions first, then scan the passage for the relevant part.",
        "For main idea questions, identify the topic, the tone and the author's purpose. Read once and move on.",
        "For inference questions, the answer is not directly stated but logically follows. For example, if the passage says the natives respected nature, you can infer that they valued the environment.",
        "For vocabulary questions, use context and not the dictionary meaning. For example, sanitised in sanitised barbarism means made to seem clean or acceptable, not physically clean.",
        "For fact questions, the answer is directly in the passage. Look for exact words or their synonyms.",
        "Beware of extreme words in options such as all, never, always and only. They are usually wrong. For example, if the passage says virtual elimination, an option saying total elimination is wrong.",
        "Beware of the scope trap, which means options that are too broad or too narrow. Stick to what the passage says.",
        "For except questions, three options are true and one is false. Find the false one."
      ],
      "cheatCodes": [
        "The first sentence of a paragraph usually tells you what the paragraph is about. Read it carefully.",
        "For tone questions, look at the adjectives the author uses. Words like shocking, unfortunately and ironically signal criticism.",
        "For inference, eliminate options that cannot be true from the passage, then pick the safest one.",
        "Which cannot be inferred means find the option that goes beyond the passage or contradicts it. For example, if the passage says some, the option saying all is the answer."
      ],
      "questions": [
        {"q":"PASSAGE: On August 3, 1492, Christopher Columbus set sail from Palos, Spain, with less than a hundred crew members to discover a new route to Asia. After spending a difficult time at sea, the party sighted land early on the morning of October 12, 1492. They set foot on an island in the Bahamas which they named Al Salvador. Columbus presumed that the indigenous people were Native Indians as he was under the mistaken belief that he had set foot on Indian soil. Probably some 10 million American Indians were natives to the land before the large-scale inhabitation by Europeans and subsequent annihilation of Native Americans started. However, it took more than a hundred years after Columbus discovered America for the Europeans to finally take the momentous decision to make the New World their home. The Native Americans actually welcomed the pale-skinned visitors primarily out of curiosity. They were fascinated by the steel knives and swords, fire spewing cannons, brass and copper utensils. Eventually, cultural differences erupted. The natives could not stomach the arrogance of the newcomers and the scant respect they paid to nature. The European settlers viewed every resource, plants, animals and people, as something to be commercially exploited. The native Indians were vastly outnumbered in the wars that ensued. The resistance they put up never proved enough. The nomadic lifestyle of the Indians, the relatively unsophisticated weapons at their disposal, the unwillingness of some of their own people to defend themselves, and the diseases of the white men all contributed to the virtual elimination of their race. Some of the diseases brought by Europeans that decimated the natives were small pox, plague, measles, cholera, typhoid and malaria. These deadly diseases, to which most natives had developed no resistance, devastated many tribes between 1775 and 1850. America was named after an Italian navigator, Amerigo Vespucci. QUESTION: The primary purpose of the passage is to:","options":["Disprove the notion that America was named after Columbus","Provide a snapshot of the discovery of America and the early years of settlements","Explain how the Europeans eliminated the Native Americans in their own land","Discuss how the process of colonization of America started"],"answer":1,"explanation":"The passage covers discovery, early settlements and native relations, so a snapshot is the best summary."},
        {"q":"From the passage we can infer that in comparison to the Europeans, Native Americans were:","options":["Careless about their environment","A very unhealthy lot","More respectful of nature","Ignorant about sanitation"],"answer":2,"explanation":"The passage says Europeans had scant respect for nature, so the natives respected nature more."},
        {"q":"What can be inferred from the third paragraph?","options":["The native Americans did not have any weapons with which to defend themselves.","The native Americans probably attached a lot of importance to and respected nature.","The native Americans did not know how to use natural resources.","The early settlers became arrogant as they could commercially exploit resources."],"answer":1,"explanation":"Europeans were criticized for scant respect to nature, so natives valued nature."},
        {"q":"Based on the passage, which of the following CANNOT be inferred? I. Alien diseases wiped out a large proportion of certain Native American tribes II. The early settlers totally eliminated the Native Americans III. To the early settlers, even people were resources to be exploited commercially","options":["Only I","Only III","I & III","Only II"],"answer":3,"explanation":"II is too extreme. The passage says virtual elimination, not total elimination."},
        {"q":"PASSAGE: It is believed that Shakespeare wrote The Merchant of Venice between 1596 and 1598. The classification of this play as a comedy could stupefy many modern day youngsters who are used to a somewhat different meaning. But during Shakespeare's times, a comedy was as poignant and melodramatic as a tragedy with separation, struggle and heightened tensions being the central theme. However, the ending was always a happy one. Many people feel more comfortable with the term problem plays or tragicomedies than comedies. This play tends to stir up a hornet's nest whenever it is discussed or staged. As The Merchant of Venice can be viewed from different perspectives, it evokes several reactions including extreme sympathy for the villain, the Jewish moneylender Shylock, and anger against the hero, his friend Bassanio, and Bassanio's wife, Portia. Shakespeare has been accused of anti-Semitism because of the contemptuous utterances of his hero who even calls the villain a cur. Critics of this play overlook the possibility that Shakespeare was just commenting upon the social situation prevailing during his time. A dispassionate analysis will reveal the superb portrayal of the deep anguish experienced by the marginalized sections of society. Sample these lines of Shylock: Hath not a Jew eyes? Hath not a Jew hands, organs, dimensions, senses, affections, passions...If you prick us, do we not bleed? These powerful words put by Shakespeare into the mouth of a man portrayed as a villain would not be so potent if this master dramatist had no deep-felt empathy for a character, who probably was more wronged than he wronged others. QUESTION: From the passage, we can infer that the author is:","options":["Of the opinion that Shakespeare had no deep-felt empathy for any of his characters","Uncomfortable with the notion of heroes possessing negative traits","Uncomfortable with the term comedy being used for plays like The Merchant of Venice","Supporting the critics who feel that the hero is not a likeable character"],"answer":2,"explanation":"The passage says these sentences explain the discomfort of we modernists when such dramas are called comedies."},
        {"q":"PASSAGE: The need for knowledge of the constitution and functions of human nature is great because the teacher's attitude to subject matter is different from the pupil's. The teacher presents in actuality what the pupil represents only in posse. That is, the teacher already knows the things which the student is only learning. Hence the problem of the two is radically unlike. When engaged in the direct act of teaching, the instructor needs to have subject matter at his fingers' ends; his attention should be upon the attitude and response of the pupil. To understand the latter in its interplay with subject matter is his task, while the pupil's mind, naturally, should be not on itself but on the topic in hand. Or to state the same point in a somewhat different manner: the teacher should be occupied not with subject matter in itself but in its interaction with the pupils' present needs and capacities. Hence simple scholarship is not enough. QUESTION: It can be inferred that:","options":["Simple scholarship is lop-sided in its focus","Simple scholarship might overlook the subject matter","Simple scholarship, with a narrow focus, might not place enough emphasis on the student's needs","Simple scholarship will always be lopsided in nature"],"answer":2,"explanation":"The passage says the teacher should focus on students' needs, so narrow scholarship misses student needs."},
        {"q":"PASSAGE: A being whose activities are associated with others has a social environment. What he does and what he can do depend upon the expectations, demands, approvals and condemnations of others. A being connected with other beings cannot perform his own activities without taking the activities of others into account. For they are the indispensable conditions of the realization of his tendencies. We might as well try to imagine a business man doing business all by himself, as to conceive it possible to define the activities of an individual in terms of his isolated actions. Thinking and feeling that have to do with action in association with others is as much a social mode of behavior as is the most overt cooperative or hostile act. QUESTION: It can be inferred that:","options":["In our social world, one's thinking, feelings and actions cannot stand in isolation to actions of others","In our social world, thinking, feelings and actions of an individual are driven by motivations of others","In our social world, thinking, feelings and actions of a person cannot stand in isolation to those of others","In our social world, thinking, feelings and actions of a single person are juxtaposed retrospectively to those of others"],"answer":2,"explanation":"The passage says we cannot act in isolation and that thinking and feeling are also social modes."},
        {"q":"PASSAGE: An increase in the level of serotonin in the human body is known to significantly enhance the mood of the person and in some cases, help people overcome depression. Serotonin taken orally does not pass into the pathways of the central nervous system because it does not cross the blood-brain barrier. However, tryptophan and its metabolite 5-hydroxytryptophan, from which serotonin is synthesized, do cross the blood-brain barrier. These agents are available as dietary supplements and may be effective serotonergic agents. QUESTION: Which of the following can be correctly inferred?","options":["Individuals who do not consume enough tryptophan can develop depressive tendencies","Individuals who consume tryptophan can metabolize enough serotonin and do not run the risk of depression","Consumption of serotonin-laced foods can help cure depression in some cases","Tryptophan is an effective agent that can help cure depression in some cases"],"answer":3,"explanation":"The passage says tryptophan crosses the blood-brain barrier and may be effective, so D is the safest inference."},
        {"q":"PASSAGE: An increase in the median income of the middle class does not cause average levels of education for the middle class to go up. If they did, then countries with the highest median income of the middle class would also have the highest levels of education for this class. In fact, when the median income of the middle class is made suitably comparable for different countries, accounting for inflation, currency fluctuations and purchasing power parity, there is no such correlation. QUESTION: Which can be correctly inferred?","options":["Countries with the highest median income of the middle class do not have the highest levels of education for the middle class","It is difficult to reliably compare the education and income levels of one country with another","A reduction in the median income of the middle class of the country will not necessarily lower the average level of education for the said class","Countries with low levels of education for the middle class have comparatively higher levels of median income"],"answer":0,"explanation":"The passage directly states that there is no correlation between highest median income and highest education."},
        {"q":"PASSAGE: Political education may be defined as the preparation of a citizen to take well informed, responsible and sustained action for participation in the national struggle in order to achieve the socio-economic objectives of the country. The predominant socio-economic objectives in India are the abolition of poverty and the creation of a modern democratic, secular and socialist society in place of the present traditional, feudal, hierarchical and inegalitarian one. Under colonial rule, Congress leaders argued that political education was important. But when they came to power in 1947 they almost adopted the British policy. The wise academicians wanted political support without political interference. What we have actually received is infinite political interference with little genuine political support. This interference with the educational system by political parties for their own ulterior motives is no political education at all. QUESTION: What should be the main purpose of political education?","options":["To bring qualitative change in the entire education system","To create an egalitarian society","To prepare the young generation with high intellectual acumen","To champion the cause of elitism"],"answer":1,"explanation":"The passage says the objective is to replace the present inegalitarian society, so the goal is an egalitarian society."},

const STORAGE_KEY = "verbalCram.progress.v1";

let DATA = null;
let progress = loadProgress(); // { "sectionId:index": true/false }
let currentSection = null;

function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch { return {}; }
}
function saveProgress() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
}
function key(sid, i) { return sid + ":" + i; }

async function init() {
  try {
    const res = await fetch("data.json");
    if (!res.ok) throw new Error("no data.json");
    DATA = await res.json();
  } catch (e) {
    DATA = FALLBACK;
  }
  buildNav();
  showSection(DATA.sections[0].id);
  updateProgressBar();
}

function buildNav() {
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  DATA.sections.forEach(s => {
    const b = document.createElement("button");
    b.textContent = (s.icon || "") + " " + s.title;
    b.dataset.id = s.id;
    b.onclick = () => showSection(s.id);
    nav.appendChild(b);
  });
}

function showSection(id) {
  currentSection = id;
  document.querySelectorAll("#nav button").forEach(b => {
    b.classList.toggle("active", b.dataset.id === id);
  });
  const s = DATA.sections.find(x => x.id === id);
  const main = document.getElementById("main");
  main.innerHTML = "";

  const h = document.createElement("h2");
  h.className = "section-title";
  h.textContent = (s.icon || "") + " " + s.title;
  main.appendChild(h);

  const p = document.createElement("p");
  p.className = "section-desc";
  p.textContent = s.description || "";
  main.appendChild(p);

  if (s.rules && s.rules.length) {
    const c = document.createElement("div");
    c.className = "card";
    c.innerHTML = "<h3>Rules</h3><ul>" + s.rules.map(r => "<li>" + esc(r) + "</li>").join("") + "</ul>";
    main.appendChild(c);
  }
  if (s.cheatCodes && s.cheatCodes.length) {
    const c = document.createElement("div");
    c.className = "card";
    c.innerHTML = "<h3>Cheat Codes</h3><ul>" + s.cheatCodes.map(r => "<li>" + esc(r) + "</li>").join("") + "</ul>";
    main.appendChild(c);
  }

  const qHeader = document.createElement("h3");
  qHeader.style.marginTop = "22px";
  qHeader.textContent = "Practice (" + s.questions.length + " questions)";
  main.appendChild(qHeader);

  s.questions.forEach((q, i) => main.appendChild(renderQuestion(s, q, i)));
}

function renderQuestion(section, q, idx) {
  const k = key(section.id, idx);
  const state = progress[k]; // true=correct, false=wrong, undefined=unanswered
  const wrap = document.createElement("div");
  wrap.className = "q";

  const qt = document.createElement("div");
  qt.className = "q-text";
  qt.innerHTML = esc(q.q) + ` <span class="badge ${state===true?'done':state===false?'wrong-done':''}">${state===true?'✓ done':state===false?'✗ wrong':'?'}</span>`;
  wrap.appendChild(qt);

  const expl = document.createElement("div");
  expl.className = "explanation";
  expl.textContent = "Why: " + q.explanation;

  q.options.forEach((opt, oi) => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = String.fromCharCode(65 + oi) + ". " + opt;
    btn.onclick = () => {
      // Mark all options disabled
      wrap.querySelectorAll(".option").forEach(b => b.disabled = true);
      if (oi === q.answer) {
        btn.classList.add("correct");
        progress[k] = true;
      } else {
        btn.classList.add("wrong");
        // highlight correct one
        const correctBtn = wrap.querySelectorAll(".option")[q.answer];
        correctBtn.classList.add("correct");
        // only record wrong if not already correct
        if (progress[k] !== true) progress[k] = false;
      }
      saveProgress();
      updateProgressBar();
      // update badge
      const badge = qt.querySelector(".badge");
      badge.className = "badge " + (progress[k] === true ? "done" : "wrong-done");
      badge.textContent = progress[k] === true ? "✓ done" : "✗ wrong";
      expl.classList.add("show");
    };
    wrap.appendChild(btn);
  });

  // If already answered before, prefill
  if (state !== undefined) {
    const opts = wrap.querySelectorAll(".option");
    opts.forEach(b => b.disabled = true);
    opts[q.answer].classList.add("correct");
    if (state === false) {
      // We don't know which wrong one was picked; just show the correct one.
    }
    expl.classList.add("show");
  }

  wrap.appendChild(expl);
  return wrap;
}

function updateProgressBar() {
  let total = 0, correct = 0;
  DATA.sections.forEach(s => {
    s.questions.forEach((_, i) => {
      total++;
      if (progress[key(s.id, i)] === true) correct++;
    });
  });
  const pct = total ? Math.round((correct / total) * 100) : 0;
  document.getElementById("bar").style.width = pct + "%";
  document.getElementById("progressText").textContent = correct + " / " + total + " correct (" + pct + "%)";
}

function esc(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

document.getElementById("resetBtn").onclick = () => {
  if (confirm("Reset all progress?")) {
    progress = {};
    saveProgress();
    showSection(currentSection);
    updateProgressBar();
  }
};

init();
</script>
